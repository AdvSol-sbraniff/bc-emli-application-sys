<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Modernizing Invoice Review</title>
  <desc id="description">A simplified three-stage diagram showing today's manual invoice review, a reusable AI-assisted workflow, and the resulting reduction in rework with human judgment retained.</desc>

  <rect width="1600" height="900" fill="#ffffff"/>

  <text x="800" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="54" font-weight="700" fill="#3d1968">Modernizing Invoice Review</text>
  <text x="800" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#59616b">Earlier signals  •  less rework  •  better-supported decisions</text>

  <!-- TODAY -->
  <rect x="65" y="190" width="420" height="455" rx="24" fill="#f4f5f7" stroke="#747b84" stroke-width="3"/>
  <path d="M89 190h372a24 24 0 0 1 24 24v70H65v-70a24 24 0 0 1 24-24z" fill="#6f7680"/>
  <text x="275" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">TODAY</text>

  <rect x="115" y="325" width="320" height="62" rx="12" fill="#ffffff" stroke="#c7cbd1" stroke-width="2"/>
  <text x="275" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#26313c">Manual data re-entry</text>
  <path d="M275 390v25" stroke="#9aa0a8" stroke-width="4" stroke-linecap="round"/>
  <path d="M264 407l11 14 11-14" fill="none" stroke="#9aa0a8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="115" y="425" width="320" height="62" rx="12" fill="#ffffff" stroke="#c7cbd1" stroke-width="2"/>
  <text x="275" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#26313c">Full manual review</text>
  <path d="M275 490v25" stroke="#9aa0a8" stroke-width="4" stroke-linecap="round"/>
  <path d="M264 507l11 14 11-14" fill="none" stroke="#9aa0a8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="115" y="525" width="320" height="62" rx="12" fill="#ffffff" stroke="#c7cbd1" stroke-width="2"/>
  <text x="275" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#26313c">Problems found late</text>

  <rect x="115" y="606" width="320" height="54" rx="12" fill="#a9463f"/>
  <text x="275" y="641" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">REWORK &amp; DELAY</text>

  <!-- CONNECTOR 1 -->
  <path d="M505 410h56" stroke="#5f249f" stroke-width="8" stroke-linecap="round"/>
  <path d="M548 391l25 19-25 19" fill="none" stroke="#5f249f" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- REUSABLE WORKFLOW -->
  <rect x="590" y="190" width="420" height="455" rx="24" fill="#f5effa" stroke="#5f249f" stroke-width="3"/>
  <path d="M614 190h372a24 24 0 0 1 24 24v70H590v-70a24 24 0 0 1 24-24z" fill="#5f249f"/>
  <text x="800" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff">REUSABLE AI WORKFLOW</text>

  <g font-family="Arial, sans-serif" font-size="23" fill="#3d1968">
    <circle cx="655" cy="339" r="22" fill="#ffffff" stroke="#5f249f" stroke-width="3"/>
    <text x="655" y="347" text-anchor="middle" font-size="21" font-weight="700">1</text>
    <text x="697" y="338">
      <tspan x="697" dy="0">Submit invoice and</tspan>
      <tspan x="697" dy="27">documents</tspan>
    </text>

    <path d="M655 366v28" stroke="#bca1d4" stroke-width="4" stroke-linecap="round"/>
    <circle cx="655" cy="423" r="22" fill="#ffffff" stroke="#5f249f" stroke-width="3"/>
    <text x="655" y="431" text-anchor="middle" font-size="21" font-weight="700">2</text>
    <text x="697" y="431">Read, classify and extract</text>

    <path d="M655 450v28" stroke="#bca1d4" stroke-width="4" stroke-linecap="round"/>
    <circle cx="655" cy="507" r="22" fill="#ffffff" stroke="#5f249f" stroke-width="3"/>
    <text x="655" y="515" text-anchor="middle" font-size="21" font-weight="700">3</text>
    <text x="697" y="515">Check evidence against rules</text>

    <path d="M655 534v28" stroke="#bca1d4" stroke-width="4" stroke-linecap="round"/>
    <circle cx="655" cy="591" r="22" fill="#ffffff" stroke="#5f249f" stroke-width="3"/>
    <text x="655" y="599" text-anchor="middle" font-size="21" font-weight="700">4</text>
    <text x="697" y="599">Organize guidance</text>
  </g>

  <rect x="640" y="622" width="320" height="54" rx="12" fill="#3d1968"/>
  <text x="800" y="657" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff">EVIDENCE STAYS CONNECTED</text>

  <!-- CONNECTOR 2 -->
  <path d="M1030 410h56" stroke="#5f249f" stroke-width="8" stroke-linecap="round"/>
  <path d="M1073 391l25 19-25 19" fill="none" stroke="#5f249f" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- OUTCOME -->
  <rect x="1115" y="190" width="420" height="455" rx="24" fill="#eff8f2" stroke="#2e7d4b" stroke-width="3"/>
  <path d="M1139 190h372a24 24 0 0 1 24 24v70h-420v-70a24 24 0 0 1 24-24z" fill="#2e7d4b"/>
  <text x="1325" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">OUTCOME</text>

  <g font-family="Arial, sans-serif" fill="#224f33">
    <circle cx="1190" cy="350" r="22" fill="#2e7d4b"/>
    <path d="M1180 350l7 8 14-18" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1230" y="358" font-size="25">Less duplicate entry</text>

    <circle cx="1190" cy="434" r="22" fill="#2e7d4b"/>
    <path d="M1180 434l7 8 14-18" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1230" y="442" font-size="25">Earlier feedback</text>

    <circle cx="1190" cy="518" r="22" fill="#2e7d4b"/>
    <path d="M1180 518l7 8 14-18" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1230" y="515" font-size="23">
      <tspan x="1230" y="515">Faster and smarter</tspan>
      <tspan x="1230" y="542">administration</tspan>
    </text>
  </g>

  <rect x="1165" y="574" width="320" height="86" rx="12" fill="#23643b"/>
  <text x="1325" y="611" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff">HUMAN JUDGMENT</text>
  <text x="1325" y="639" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff">STAYS IN CONTROL</text>

  <!-- GUARDRAILS -->
  <rect x="110" y="725" width="1380" height="105" rx="22" fill="#f3eff7" stroke="#d7c8e5" stroke-width="2"/>
  <text x="800" y="760" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#5f249f">BUILT-IN GUARDRAILS</text>

  <g font-family="Arial, sans-serif" font-size="22" fill="#3d1968">
    <circle cx="315" cy="794" r="19" fill="#5f249f"/>
    <path d="M306 794l6 7 12-15" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="347" y="802">Program policy unchanged</text>

    <circle cx="755" cy="794" r="19" fill="#5f249f"/>
    <path d="M746 794l6 7 12-15" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="787" y="802">Human decisions retained</text>

    <circle cx="1168" cy="794" r="19" fill="#5f249f"/>
    <path d="M1159 794l6 7 12-15" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1200" y="802">Auditable and privacy-aware</text>
  </g>
</svg>
