# /helm/main/values-ce8baa-dev.yaml 
global:
  vault:
    role: ce8baa-nonprod
    subPath: ce8baa-dev
  env: {}

  # Keep empty unless you confirm a pull secret in ce8baa-dev.
  imagePullSecrets: []

app:
  enabled: true
  image:
    repository: ghcr.io/advsol-sbraniff/hesp-app
    pullPolicy: Always

  resources:
    requests:
      cpu: 300m
      memory: 512Mi

  env:
    # Fill these once your gold routes/IdP endpoints are finalized.
    'APP_DOMAIN': 'hesp-app-ce8baa-dev.apps.gold.devops.gov.bc.ca'
    'INV_NODE_BASE_URL': 'http://hesp-claims-ai:3001'
    'SECURE_JWT_COOKIE': 'true'
    'VITE_ENABLE_TEMPLATE_FORCE_PUBLISH': 'true'
    'ENABLE_TEMPLATE_FORCE_PUBLISH': 'true'
    'ANYCABLE_URL': 'wss://hesp-anycable-go-ce8baa-dev.apps.gold.devops.gov.bc.ca/cable'
    'KEYCLOAK_AUTH_URL': 'https://dev.loginproxy.gov.bc.ca/'
    'VITE_SITEMINDER_LOGOUT_URL': ''
    'VITE_BCEID_URL': ''
    'VITE_BUSINESS_BCEID_REGISTRATION_URL': ''
    'VITE_KEYCLOAK_LOGOUT_URL': 'https://dev.loginproxy.gov.bc.ca/auth/realms/standard/protocol/openid-connect/logout'
    'VITE_POST_LOGOUT_REDIRECT_URL': 'https://hesp-app-ce8baa-dev.apps.gold.devops.gov.bc.ca'

    # File upload / object storage placeholders (override as needed).
    'BCGOV_OBJECT_STORAGE_REGION': 'ca-central-1'
    'BCGOV_OBJECT_STORAGE_ENDPOINT': 'https://s3.ca-central-1.amazonaws.com'
    'BCGOV_OBJECT_STORAGE_PUBLIC_ENDPOINT': 'https://s3.ca-central-1.amazonaws.com'
    'BCGOV_OBJECT_STORAGE_BUCKET': ''
    'AWS_PARAMETER_BASE_PATH': ''
    'AWS_REGION': 'ca-central-1'
    'AWS_DEFAULT_REGION': 'ca-central-1'

    # ClamAV
    'CLAMAV_ENABLED': 'true'
    'CLAMAV_HOST': 'hesp-clamav'
    'CLAMAV_PORT': '3310'
    'CLAMAV_TIMEOUT': '30'
    'VIRUS_SCAN_TEMP_DIR': '/tmp/virus_scan'
    'UPLOAD_VIRUS_SCAN_TIMEOUT': '45'

  route:
    enabled: true
    host: ''

sidekiq:
  enabled: true
  image:
    repository: ghcr.io/advsol-sbraniff/hesp-app

  resources:
    requests:
      cpu: 100m
      memory: 256Mi

  env:
    'APP_DOMAIN': 'hesp-app-ce8baa-dev.apps.gold.devops.gov.bc.ca'
    'FROM_EMAIL': 'no-reply@gov.bc.ca'
    'INV_NODE_BASE_URL': 'http://hesp-claims-ai:3001'
    'SIDEKIQ_QUEUES': 'default,virus_scan,file_processing,webhooks,websocket,model_callbacks'

    'BCGOV_OBJECT_STORAGE_REGION': 'ca-central-1'
    'BCGOV_OBJECT_STORAGE_ENDPOINT': 'https://s3.ca-central-1.amazonaws.com'
    'BCGOV_OBJECT_STORAGE_PUBLIC_ENDPOINT': 'https://s3.ca-central-1.amazonaws.com'
    'BCGOV_OBJECT_STORAGE_BUCKET': ''
    'AWS_PARAMETER_BASE_PATH': ''
    'AWS_REGION': 'ca-central-1'
    'AWS_DEFAULT_REGION': 'ca-central-1'

    'CLAMAV_ENABLED': 'true'
    'CLAMAV_HOST': 'hesp-clamav'
    'CLAMAV_PORT': '3310'
    'CLAMAV_TIMEOUT': '30'
    'VIRUS_SCAN_TEMP_DIR': '/tmp/virus_scan'
    'UPLOAD_VIRUS_SCAN_TIMEOUT': '45'

sidekiqClaims:
  enabled: true
  image:
    repository: ghcr.io/advsol-sbraniff/hesp-app

  resources:
    requests:
      cpu: 50m
      memory: 128Mi

  env:
    'INV_NODE_BASE_URL': 'http://hesp-claims-ai:3001'
    'SIDEKIQ_CONCURRENCY': '1'
    'SIDEKIQ_QUEUES': 'claims_ocr,claims_genai'

claimsAi:
  enabled: true
  image:
    repository: ghcr.io/advsol-sbraniff/hesp-claims-ai

  resources:
    requests:
      cpu: 50m
      memory: 128Mi

  env:
    'PORT': '3001'

anycable-rpc:
  enabled: true
  image:
    repository: ghcr.io/advsol-sbraniff/hesp-app

  nameOverride: hesp-anycable-rpc
  fullnameOverride: hesp-anycable-rpc

  resources:
    requests:
      cpu: 50m
      memory: 128Mi

  env:
    'BCGOV_OBJECT_STORAGE_REGION': 'ca-central-1'
    'BCGOV_OBJECT_STORAGE_ENDPOINT': 'https://s3.ca-central-1.amazonaws.com'
    'BCGOV_OBJECT_STORAGE_PUBLIC_ENDPOINT': 'https://s3.ca-central-1.amazonaws.com'
    'BCGOV_OBJECT_STORAGE_BUCKET': ''
    'AWS_PARAMETER_BASE_PATH': ''
    'AWS_REGION': 'ca-central-1'
    'AWS_DEFAULT_REGION': 'ca-central-1'

crunchy-postgres:
  enabled: true

  instances:
    replicas: 1
    dataVolumeClaimSpec:
      storage: 1Gi
    requests:
      cpu: 10m
      memory: 256Mi
    replicaCertCopy:
      requests:
        cpu: 10m
        memory: 32Mi

  pgBackRest:
    retention: '3'
    retentionFullType: time
    repos:
      volume:
        storage: 1Gi
    repoHost:
      requests:
        cpu: 1m
        memory: 64Mi
    sidecars:
      requests:
        cpu: 1m
        memory: 64Mi
    s3:
      enabled: false

  patroni:
    postgresql:
      pg_hba:
        - 'host all all ::1/128 md5'
        - 'host all all 0.0.0.0/0 md5'
      parameters:
        shared_buffers: 16MB
        wal_buffers: 64kB
        min_wal_size: 32MB
        max_wal_size: 64MB
        max_slot_wal_keep_size: 128MB

  proxy:
    pgBouncer:
      replicas: 2
      requests:
        cpu: 50m
        memory: 64Mi

  pgmonitor:
    enabled: false
    exporter:
      requests:
        cpu: 1m
        memory: 64Mi

redis:
  enabled: true
  sentinel:
    resources:
      requests:
        memory: 128Mi
        cpu: 20m
  replica:
    replicaCount: 1
    persistence:
      enabled: true
      size: 128Mi
    resources:
      requests:
        memory: 128Mi
        cpu: 20m

elasticsearch:
  enabled: true

  master:
    replicaCount: 1
    heapSize: 128m
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
    persistence:
      enabled: true
      accessModes:
        - ReadWriteOnce
      size: 256Mi

  data:
    replicaCount: 1
    heapSize: 1024m
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
    persistence:
      enabled: true
      accessModes:
        - ReadWriteOnce
      size: 256Mi

anycableGo:
  enabled: true
  route:
    enabled: true
    host: ''
  resources:
    requests:
      cpu: 50m
      memory: 256Mi

clamav:
  enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 1Gi
    limits:
      cpu: 200m
      memory: 2Gi
  persistence:
    size: 256Mi
  virusScanTempVolume:
    enabled: true
    size: 512Mi